<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9333EA" />
    <title>Offline — Recruiter X</title>
    <!--
      Served by sw.js when a navigation fails. Must be fully self-contained:
      no /assets/* references (those are hashed and may not be cached) and no
      cross-origin fonts (CSP is default-src 'self'). No inline script either —
      script-src is 'self' with no 'unsafe-inline', so retry is a plain link.
    -->
    <style>
      :root {
        --brand: #9333ea;
        --ink: #0f172a;
        --muted: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: var(--ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
      }
      img {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
      }
      a {
        display: inline-block;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 500;
        text-decoration: none;
        color: #fff;
        background: var(--brand);
      }
      a:hover {
        filter: brightness(1.08);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f1f5f9;
        }
        p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Recruiter X" />
      <h1>You're offline</h1>
      <p>
        Recruiter X needs a connection to reach your candidates, jobs and
        invoices. Reconnect and try again.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
