project_id = "recruiter-x"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[analytics]
enabled = false

# ── Edge Function JWT overrides ───────────────────────────────────────────────
# Webhook endpoints are called by external services (no JWT)
[functions.channelMessageWebhook]
verify_jwt = false

[functions.inboundEmailWebhook]
verify_jwt = false

[functions.healthCheck]
verify_jwt = false

[functions.validateWhatsappRegistrationCode]
verify_jwt = false

# livekitToken has always run with verify_jwt off (see VideoCall.jsx setup notes).
# Declared explicitly so `functions deploy` can't silently flip it to the `true`
# default. It is no longer unprotected: requireApprovedUser() in the handler
# verifies the caller's JWT itself and requires an approved profile, so the
# platform flag is not what was guarding it.
[functions.livekitToken]
verify_jwt = false
